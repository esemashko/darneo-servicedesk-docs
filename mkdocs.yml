site_name: Darneo ServiceDesk
site_description: Документация модуля Darneo ServiceDesk
site_url: https://esemashko.github.io/darneo-servicedesk-docs/
repo_url: https://github.com/esemashko/darneo-servicedesk-docs
repo_name: esemashko/darneo-servicedesk-docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Темная тема
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

plugins:
  - search:
      lang:
        - ru
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Главная: index.md
  - Быстрый старт: quick-start.md
  - Установка: installation.md
  - Пользователю:
      - Обзор: user-guide/index.md
      - Заявки: user-guide/tickets.md
  - Администратору:
      - Обзор: admin/index.md
      - Пакеты обновлений: admin/update-package.md
  - Разработчику:
      - Обзор архитектуры: developer/index.md
      - API и AJAX: developer/api.md
  - История изменений: changelog.md
