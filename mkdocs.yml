site_name: Darneo ServiceDesk
site_description: Пользовательская документация Darneo ServiceDesk
site_url: https://esemashko.github.io/darneo-servicedesk-docs/

theme:
  name: material
  language: ru
  custom_dir: overrides
  icon:
    logo: material/headset
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Темная тема
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search:
      lang:
        - ru
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Главная: index.md
  - Начало работы:
      - Обзор раздела: start/index.md
      - Установка решения: start/installation.md
      - Первый вход: start/first-login.md
  - Интерфейс:
      - Обзор интерфейса: interface/index.md
      - Навигация: interface/navigation.md
      - Списки и таблицы: interface/lists-and-tables.md
      - Вкладки и колонки: interface/tabs-and-columns.md
      - Поиск и фильтры: interface/search-and-filters.md
  - Заявки:
      - Обзор заявок: tickets/index.md
      - Список заявок: tickets/list.md
      - Карточка заявки: tickets/card.md
      - Создание заявки: tickets/create.md
      - Комментарии: tickets/comments.md
      - Файлы: tickets/files.md
      - Статусы: tickets/statuses.md
  - Типовые сценарии:
      - Обзор сценариев: workflows/index.md
      - Сценарии использования Helpdesk: workflows/use-cases.md
      - Обработка обращения: workflows/request-processing.md
      - Поиск нужной заявки: workflows/find-ticket.md
      - Передача заявки другому сотруднику: workflows/reassign-ticket.md
  - Клиенты и объекты:
      - Обзор раздела: objects/index.md
      - Клиенты: objects/clients.md
      - Компании: objects/companies.md
      - Оборудование: objects/equipment.md
  - Настройки:
      - Заявки:
          - Общие:
              - Настройки модуля: settings/tickets/general/main.md
              - Оповещения: settings/tickets/general/notify.md
          - Поля и интерфейс:
              - Дополнительные поля: settings/tickets/fields/property.md
              - Вкладки заявок: settings/tickets/fields/ticket-tabs.md
          - Справочники:
              - Обзор: settings/tickets/dictionaries/index.md
              - Типы заявок: settings/tickets/dictionaries/type.md
              - Приоритеты: settings/tickets/dictionaries/priority.md
              - Статусы: settings/tickets/dictionaries/status.md
          - Автоматизация:
              - Маршрутизация заявок: settings/tickets/automation/ticket-routing/index.md
              - Плановые заявки: settings/tickets/automation/ticket-schedule/index.md
          - SLA:
              - Обзор: settings/tickets/sla/index.md
              - SLA правила: settings/tickets/sla/rule.md
              - Графики работы: settings/tickets/sla/schedule.md
      - Оборудование:
          - Справочники:
              - Обзор: settings/equipment/dictionaries/index.md
              - Типы оборудования: settings/equipment/dictionaries/type.md
              - Производители: settings/equipment/dictionaries/manufacturer.md
              - Модели оборудования: settings/equipment/dictionaries/model.md
          - Плановое обслуживание:
              - Обзор: settings/maintenance/index.md
              - Контуры обслуживания: settings/maintenance/object.md
              - Сценарии обслуживания: settings/maintenance/scenario.md
              - Регламенты обслуживания: settings/maintenance/regulation.md
      - Сотрудники:
          - Организация:
              - Отделы: settings/staff/organization/department.md
          - Доступ:
              - Ограничения сотрудников: settings/staff/access/restrictions.md
              - Права доступа: settings/staff/access/permission.md
      - Интеграции:
          - Каналы:
              - Email: settings/integration/channels/mail.md
  - Уведомления: notifications.md
  - Справка:
      - Частые вопросы: reference/faq.md
      - Решение проблем: reference/troubleshooting.md
      - Глоссарий: reference/glossary.md
